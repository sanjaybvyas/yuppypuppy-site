*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --purple-deep: #0d0221;
  --purple-dark: #1a0a3e;
  --purple-mid: #6c3fa0;
  --purple-bright: #9b59f5;

  --neon-purple: #bf5af2;
  --neon-pink: #ff2d78;
  --neon-teal: #00f5d4;

  --teal-glow: rgba(0,245,212,0.15);
  --gold: #ffd700;
  --white: #ffffff;
  --gray-light: #f0eaf8;
  --text-muted: #b8a9cc;
}

html { scroll-behavior: smooth; font-size: 16px; height: -webkit-fill-available; }

/* Performance: content-visibility for below-fold sections */
section:not(:first-of-type) { content-visibility: auto; contain-intrinsic-size: auto 800px; }

/* Performance: will-change for animated elements */
.orb, .service-card, .trust-item, .bone-divider span, .paw { will-change: transform; }

body {
  font-family: 'Outfit', sans-serif;
  background: var(--purple-deep);
  color: var(--white);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  min-height: -webkit-fill-available;
  min-height: 100dvh;

}

/* ===== ANIMATED BACKGROUND ===== */
.bg-glow {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; height: 100dvh; z-index: -1;
  background:
    radial-gradient(ellipse 80% 50% at 20% 20%, rgba(107,63,160,0.25) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 80%, rgba(0,245,212,0.08) 0%, transparent 50%),
    radial-gradient(ellipse 40% 40% at 60% 30%, rgba(191,90,242,0.12) 0%, transparent 50%),
    radial-gradient(ellipse 50% 50% at 30% 70%, rgba(57,255,20,0.04) 0%, transparent 60%),
    var(--purple-deep);
}
/* Floating orbs */
.orb {
  position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: -1;
  animation: orbFloat 20s ease-in-out infinite alternate;
}
.orb-1 { width: 400px; height: 400px; top: 10%; left: -5%; background: rgba(191,90,242,0.12); }
.orb-2 { width: 300px; height: 300px; bottom: 20%; right: -5%; background: rgba(0,245,212,0.08); animation-delay: -7s; animation-duration: 25s; }
.orb-3 { width: 250px; height: 250px; top: 50%; left: 40%; background: rgba(57,255,20,0.05); animation-delay: -14s; animation-duration: 30s; }
.orb-4 { width: 350px; height: 350px; top: 70%; right: 20%; background: rgba(0,245,212,0.05); animation-delay: -10s; animation-duration: 28s; }
@keyframes orbFloat {
  0% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(30px, -40px) scale(1.1); }
  66% { transform: translate(-20px, 30px) scale(0.9); }
  100% { transform: translate(10px, -20px) scale(1.05); }
}

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: var(--purple-deep); }
::-webkit-scrollbar-thumb { background: linear-gradient(var(--neon-teal), var(--neon-purple)); border-radius: 3px; }

  transition: all 0.4s cubic-bezier(0.16,1,0.3,1);

nav.scrolled { padding: 0.5rem 2rem; background: rgba(13,2,33,0.95); border-bottom-color: rgba(0,245,212,0.15); }

.logo {

}
.logo span { font-weight: 400; opacity: 0.7; font-size: 0.7rem; display: block;

.nav-links a::after {
  content: ''; position: absolute; bottom: -4px; left: 0; width: 0; height: 2px;
  background: linear-gradient(90deg, var(--neon-teal), var(--neon-purple));
  transition: width 0.3s cubic-bezier(0.16,1,0.3,1);
}
.nav-links a:hover { color: var(--neon-teal); }
.nav-links a:hover::after { width: 100%; }
.nav-cta {

<script>
// Nav scroll

// Mobile menu

// Phone format
// Set min date on date picker to today
document.getElementById('prefdate').min = new Date().toISOString().split('T')[0];

document.getElementById('phone').addEventListener('input', function(e) {
  let x = e.target.value.replace(/\D/g, '').match(/(\d{0,3})(\d{0,3})(\d{0,4})/);
  e.target.value = !x[2] ? x[1] : '(' + x[1] + ') ' + x[2] + (x[3] ? '-' + x[3] : '');
});

// Form submit â€” emails via FormSubmit.co + opens SMS to owner
function handleSubmit(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const d = Object.fromEntries(fd);
  var dateStr = d.prefdate || 'Flexible';
  var timeStr = d.preftime ? new Date('2000-01-01T' + d.preftime).toLocaleTimeString('en-US', {hour:'numeric',minute:'2-digit'}) : 'Flexible';

  fetch('https://formsubmit.co/ajax/yuppypuppysc@gmail.com', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
    body: JSON.stringify({
      name: d.name, phone: d.phone, email: d.email, petname: d.petname,
      breed: d.breed, service: d.service, preferred_date: dateStr, preferred_time: timeStr,
      notes: d.notes || 'None',
      _subject: 'New Appointment Request \u2014 ' + d.petname + ' (' + d.service + ') ' + dateStr
    })
  }).then(r => r.json()).then(data => {
    console.log('Email sent:', data);
  }).catch(err => console.log('Email fallback needed:', err));

  const smsBody = encodeURIComponent(
    'NEW BOOKING REQUEST\nName: ' + d.name + '\nPhone: ' + d.phone +
    '\nEmail: ' + d.email + '\nPet: ' + d.petname + ' (' + d.breed + ')' +
    '\nService: ' + d.service + '\nDate: ' + dateStr + ' @ ' + timeStr +
    (d.notes ? '\nNotes: ' + d.notes : '')
  );
  const smsLink = document.createElement('a');
  smsLink.href = 'sms:8039807387&body=' + smsBody;
  smsLink.style.display = 'none';
  document.body.appendChild(smsLink);
  smsLink.click();
  document.body.removeChild(smsLink);
  document.getElementById('successModal').classList.add('active');
  e.target.reset();
}

// Smooth scroll
document.querySelectorAll('a[href^="#"]').forEach(a => {
  a.addEventListener('click', function(e) {
    e.preventDefault();
    const t = document.querySelector(this.getAttribute('href'));
    if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
});

// Cursor glow (desktop only)
const glow = document.getElementById('cursorGlow');
if (window.matchMedia('(hover: hover)').matches) {
  document.addEventListener('mousemove', (e) => {
    const x = e.clientX / window.innerWidth;
    const y = e.clientY / window.innerHeight;
    document.querySelectorAll('.orb').forEach((orb, i) => {
      const speed = (i + 1) * 15;
      orb.style.transform = `translate(${(x - 0.5) * speed}px, ${(y - 0.5) * speed}px)`;
    });
    glow.style.left = e.clientX + 'px';
    glow.style.top = e.clientY + 'px';
  });
}

// Touch ripple for mobile
document.querySelectorAll('.service-card, .trust-item, .btn-primary, .btn-secondary, .nav-cta, .form-submit').forEach(el => {
  el.addEventListener('touchstart', function() {
    this.style.transition = 'transform 0.1s';
    this.style.transform = 'scale(0.97)';
  }, {passive: true});
  el.addEventListener('touchend', function() {
    this.style.transition = 'transform 0.3s cubic-bezier(0.16,1,0.3,1)';
    this.style.transform = '';
  }, {passive: true});
});

// ===== GSAP ANIMATIONS =====
function initGSAP() {
  if (typeof gsap === 'undefined' || typeof ScrollTrigger === 'undefined') {
    // Fallback: use IntersectionObserver if GSAP didn't load
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });
    document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
    return;
  }

  gsap.registerPlugin(ScrollTrigger);

  // Hero entrance - playful bounce
  gsap.from('.hero-badge', { opacity: 0, y: 30, duration: 0.8, ease: 'back.out(1.7)' });
  gsap.from('.hero h1', { opacity: 0, y: 50, scale: 0.95, duration: 1, delay: 0.15, ease: 'power3.out' });
  gsap.from('.hero p', { opacity: 0, y: 30, duration: 0.8, delay: 0.3, ease: 'power2.out' });
  gsap.from('.hero-buttons > *', { opacity: 0, y: 20, stagger: 0.15, duration: 0.6, delay: 0.45, ease: 'back.out(1.4)' });
  gsap.from('.hero-trust .trust-badge', { opacity: 0, y: 20, scale: 0.9, stagger: 0.12, duration: 0.6, delay: 0.7, ease: 'back.out(1.7)' });

  // Service cards - staggered with playful wiggle
  gsap.from('.service-card', {
    scrollTrigger: { trigger: '#services', start: 'top 80%' },
    opacity: 0, y: 60, rotation: -2, stagger: 0.15, duration: 0.8, ease: 'back.out(1.4)'
  });

  // Section labels & titles
  document.querySelectorAll('.section-label').forEach(el => {
    gsap.from(el, {
      scrollTrigger: { trigger: el, start: 'top 85%' },
      opacity: 0, x: -30, duration: 0.6, ease: 'power2.out'
    });
  });
  document.querySelectorAll('.section-title').forEach(el => {
    gsap.from(el, {
      scrollTrigger: { trigger: el, start: 'top 85%' },
      opacity: 0, y: 40, duration: 0.8, ease: 'power3.out'
    });
  });
  document.querySelectorAll('.glow-line').forEach(el => {
    gsap.from(el, {
      scrollTrigger: { trigger: el, start: 'top 90%' },
      width: 0, duration: 0.8, ease: 'power2.out'
    });
  });

  // Trust grid items - bounce in
  gsap.from('.trust-item', {
    scrollTrigger: { trigger: '#why', start: 'top 75%' },
    opacity: 0, y: 50, scale: 0.9, stagger: 0.12, duration: 0.7, ease: 'back.out(1.5)'
  });

  // Booking form slide up
  gsap.from('.form-container', {
    scrollTrigger: { trigger: '#book', start: 'top 75%' },
    opacity: 0, y: 80, duration: 1, ease: 'power3.out'
  });

  // Bone dividers - spin in from sides
  document.querySelectorAll('.bone-divider').forEach(el => {
    gsap.from(el.children, {
      scrollTrigger: { trigger: el, start: 'top 90%' },
      opacity: 0, scale: 0, rotation: 360, stagger: 0.08, duration: 0.5, ease: 'back.out(2)'
    });
  });

  // Parallax divider text
  gsap.to('.big-text', {
    scrollTrigger: { trigger: '.parallax-divider', start: 'top bottom', end: 'bottom top', scrub: 1 },
    x: -200, ease: 'none'
  });

  // Paw prints float with scroll parallax
  gsap.utils.toArray('.paw').forEach((paw, i) => {
    gsap.to(paw, {
      scrollTrigger: { trigger: 'body', start: 'top top', end: 'bottom bottom', scrub: 2 },
      y: `${300 + i * 80}`, rotation: 360 + i * 45, ease: 'none'
    });
  });

  // Floating text button
  gsap.from('.float-text', { opacity: 0, scale: 0, duration: 0.6, delay: 1.5, ease: 'back.out(2)' });

  // Make all remaining .reveal elements visible (those not handled above)
  document.querySelectorAll('.reveal').forEach(el => {
    gsap.from(el, {
      scrollTrigger: { trigger: el, start: 'top 88%' },
      opacity: 0, y: 30, duration: 0.6, ease: 'power2.out',
      onComplete: () => el.classList.add('visible')
    });
  });
}

// Init GSAP when ready
if (document.readyState === 'complete') {
  setTimeout(initGSAP, 100);
} else {
  window.addEventListener('load', () => setTimeout(initGSAP, 100));
}
</script>
